<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d1117"><meta name="description" content="Campusly — school collaboration, class chats, and project spaces.">
<title>Campusly — School collaboration</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--panel2:#1c2128;--line:#30363d;--text:#e6edf3;--muted:#9198a1;--purple:#a78bfa;--blue:#79c0ff;--green:#3fb950;--red:#f85149}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:64px;display:flex;align-items:center;gap:16px;padding:0 22px;border-bottom:1px solid var(--line);background:#010409;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:19px;color:#fff;text-decoration:none;white-space:nowrap}.mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#a78bfa,#6d5dfc);color:#fff;font-weight:900}.search{max-width:510px;flex:1;position:relative}.search input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 12px 9px 35px;outline:none}.search:before{content:"⌕";position:absolute;left:12px;top:4px;font-size:23px;color:var(--muted)}.topright{margin-left:auto;display:flex;align-items:center;gap:12px}.avatar{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#3b2e65;color:#e9ddff;font-weight:700}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;padding:8px 12px}.btn.primary{background:#8957e5;border-color:#8957e5;color:white}.btn:hover{filter:brightness(1.12)}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 64px)}.sidebar{border-right:1px solid var(--line);padding:18px 12px;background:#0d1117}.workspace{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:9px;margin-bottom:22px}.workspace .mark{width:30px;height:30px}.workspace strong{display:block}.workspace small{color:var(--muted)}.navlabel{color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.09em;padding:8px 10px}.navitem{width:100%;display:flex;align-items:center;gap:10px;text-align:left;color:#c9d1d9;padding:9px 10px;border:0;border-radius:7px;background:transparent;margin:2px 0}.navitem:hover,.navitem.active{background:#21262d;color:#fff}.navitem.active{box-shadow:inset 2px 0 var(--purple)}.navitem .count{margin-left:auto;color:var(--muted);font-size:12px}.channel{padding-left:20px}.main{min-width:0;display:flex;flex-direction:column}.pagehead{padding:22px 28px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.pagehead h1{font-size:20px;margin:0;font-weight:650}.pagehead p{color:var(--muted);margin:3px 0 0}.pagehead .actions{margin-left:auto;display:flex;gap:8px}.content{padding:24px 28px;max-width:1300px;width:100%;margin:0 auto}.welcome{padding:24px;border:1px solid var(--line);border-radius:12px;background:radial-gradient(ellipse at top right,#33245b55,transparent 48%),var(--panel);margin-bottom:22px}.welcome h2{margin:0 0 6px;font-size:25px}.welcome p{margin:0;color:var(--muted);max-width:680px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0 24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:17px}.card .symbol{font-size:20px;margin-bottom:12px}.card h3{margin:0 0 5px;font-size:15px}.card p{margin:0;color:var(--muted);font-size:13px}.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.sectiontitle h2{font-size:16px;margin:0}.list{border:1px solid var(--line);border-radius:10px;overflow:hidden}.listrow{padding:13px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.listrow:last-child{border:0}.listrow .details{flex:1;min-width:0}.listrow strong{display:block}.listrow small{color:var(--muted)}.tag{font-size:11px;color:#d2c1ff;background:#382a58;padding:3px 7px;border-radius:20px}.chatlayout{display:grid;grid-template-columns:minmax(0,1fr) 235px;min-height:calc(100vh - 145px)}.chatmain{display:flex;flex-direction:column;min-height:500px;min-width:0}.chatmessages{padding:22px 28px;flex:1}.message{display:flex;gap:12px;margin:0 0 22px}.message .avatar{flex-shrink:0}.messagehead{display:flex;gap:9px;align-items:center}.messagehead small{color:var(--muted)}.message p{margin:4px 0 0;color:#d1d7e0;white-space:pre-wrap;overflow-wrap:anywhere}.composer{padding:14px 24px 22px;border-top:1px solid var(--line)}.composer form{display:flex;gap:9px}.composer textarea{resize:vertical;min-height:44px;max-height:150px;flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:12px;outline:none}.members{border-left:1px solid var(--line);padding:20px 14px;background:#0b0f14}.members h3{font-size:11px;color:var(--muted);letter-spacing:.08em;margin:0 0 13px}.member{display:flex;gap:9px;align-items:center;margin:12px 0}.member .avatar{width:27px;height:27px;font-size:11px}.member small{display:block;color:var(--muted)}.empty{padding:45px 20px;text-align:center;color:var(--muted)}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0,#33245b66,transparent 55%),var(--bg)}.loginbox{width:min(420px,100%);border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:28px}.loginbox .brand{justify-content:center;margin-bottom:25px}.loginbox h1{text-align:center;font-size:22px;margin:0 0 6px}.loginbox>p{text-align:center;color:var(--muted);margin:0 0 22px}.field{margin:14px 0}.field label{display:block;margin-bottom:6px;font-weight:600}.field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text)}.loginbox .btn{width:100%;margin-top:8px}.notice{font-size:12px;color:var(--muted);margin-top:16px}.error{color:#ff938a;margin-top:10px}.audit{font-size:13px;overflow:auto}.audit th,.audit td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}.audit th{color:var(--muted);font-weight:600}.hidden{display:none!important}.mobiletoggle{display:none}
@media(max-width:850px){.layout{grid-template-columns:210px minmax(0,1fr)}.cards{grid-template-columns:1fr}.chatlayout{grid-template-columns:minmax(0,1fr)}.members{display:none}.content{padding:18px}.pagehead{padding:18px}.chatmessages{padding:18px}.top{padding:0 12px;gap:10px}}
@media(max-width:620px){.layout{display:block}.sidebar{display:none;border-bottom:1px solid var(--line)}.sidebar.open{display:block}.mobiletoggle{display:inline-flex}.topright .desktop{display:none}.pagehead{align-items:flex-start;flex-wrap:wrap}.pagehead .actions{margin-left:0;width:100%}.pagehead .actions .btn{flex:1}.search{max-width:none}.brand span:last-child{display:none}.content{padding:14px}.welcome{padding:18px}.chatmessages{padding:16px}.composer{padding:12px}.topright{gap:7px}}
</style>
</head>
<body>
<div id="app"><div class="loginwrap"><div class="loginbox"><a class="brand"><span class="mark">C</span><span>Campusly</span></a><h1>School collaboration, together.</h1><p>Loading your workspace…</p></div></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state={user:null,channels:[],channel:null,messages:[],view:"home",dms:[],audit:[],users:[],error:""};
async function api(path,options={}){const r=await fetch("/api"+path,{credentials:"same-origin",headers:{"content-type":"application/json",...(options.headers||{})},...options});let data={};try{data=await r.json()}catch{}if(!r.ok)throw Error(data.error||"Request failed");return data}
function initials(s){return String(s||"?").slice(0,2).toUpperCase()}
function brand(){return '<a class="brand" href="#" data-view="home"><span class="mark">C</span><span>Campusly</span></a>'}
function login(){ $("#app").innerHTML='<div class="loginwrap"><form class="loginbox" id="loginForm">'+brand()+'<h1>Welcome back</h1><p>Sign in to your school workspace.</p><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="64"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn primary" type="submit">Sign in</button><div id="loginError" class="error" role="alert"></div><div class="notice">Campusly administrators will never ask you to share your password.</div></form></div>';$("#loginForm").onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;$("#loginError").textContent="";try{await api("/auth/login",{method:"POST",body:JSON.stringify({username:$("#username").value,password:$("#password").value})});await start()}catch(err){$("#loginError").textContent=err.message}finally{b.disabled=false}}}
function shell(){const role=state.user.role;const active=(v)=>state.view===v?" active":"";$("#app").innerHTML='<header class="top"><button class="btn mobiletoggle" id="mobiletoggle" aria-label="Toggle navigation">☰</button>'+brand()+'<div class="search"><input id="globalSearch" placeholder="Search classes, channels, and messages…" aria-label="Search Campusly"></div><div class="topright"><button class="btn desktop" data-view="dms">✉ Messages</button><button class="btn" id="logout">Sign out</button><div class="avatar" title="'+esc(state.user.username)+'">'+esc(initials(state.user.username))+'</div></div></header><div class="layout"><aside class="sidebar" id="sidebar"><div class="workspace"><span class="mark">C</span><div><strong>Campusly</strong><small>'+esc(role)+' workspace</small></div></div><div class="navlabel">WORKSPACE</div><button class="navitem'+active("home")+'" data-view="home">⌂ Overview</button><button class="navitem'+active("classes")+'" data-view="classes">▤ My classes</button><button class="navitem'+active("dms")+'" data-view="dms">✉ Private messages</button><button class="navitem'+active("study")+'" data-view="study">◎ Study groups</button><div class="navlabel">YOUR CHANNELS</div><div id="channelNav"></div><button class="navitem" data-view="classes">＋ Browse classes</button>'+(["administrator"].includes(role)?'<div class="navlabel">ADMINISTRATION</div><button class="navitem'+active("admin")+'" data-view="admin">⚙ Admin dashboard</button><button class="navitem'+active("audit")+'" data-view="audit">▤ Audit logs</button><button class="navitem'+active("users")+'" data-view="users">♙ User management</button>':"")+(["moderator","administrator"].includes(role)?'<div class="navlabel">SAFETY</div><button class="navitem'+active("reports")+'" data-view="reports">⚑ Report queue</button>':"")+'<div class="navlabel">ACCOUNT</div><button class="navitem" data-view="profile">◉ My profile</button></aside><main class="main" id="main"></main></div>';
$("#logout").onclick=async()=>{try{await api("/auth/logout",{method:"POST",body:"{}"})}finally{state.user=null;login()}};
$("#mobiletoggle").onclick=()=>$("#sidebar").classList.toggle("open");
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>navigate(b.dataset.view)));
renderChannels();navigate(state.view);
$("#globalSearch").onkeydown=e=>{if(e.key==="Enter"&&e.target.value.trim())navigate("search",e.target.value.trim())}
}
function renderChannels(){const el=$("#channelNav");if(!el)return;el.innerHTML=state.channels.slice(0,14).map(c=>'<button class="navitem channel" data-channel="'+esc(c.id)+'"># '+esc(c.name)+'</button>').join("")||'<div style="padding:8px 10px;color:var(--muted);font-size:12px">Join a class to see channels.</div>';el.querySelectorAll("[data-channel]").forEach(b=>b.onclick=()=>openChannel(b.dataset.channel))}
function head(title,sub,actions=""){return '<div class="pagehead"><div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="actions">'+actions+'</div></div>'}
function navigate(view,query=""){state.view=view;const main=$("#main");if(!main)return;document.querySelectorAll(".navitem[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));if(view==="home"){main.innerHTML=head("Overview","Your school community at a glance.")+'<div class="content"><section class="welcome"><h2>Welcome to Campusly, '+esc(state.user.username)+'.</h2><p>A shared space for classes, discussions, study groups, and school projects. Pick a channel to join the conversation.</p></section><div class="cards"><article class="card"><div class="symbol">▤</div><h3>Class spaces</h3><p>Keep class resources and conversations together.</p></article><article class="card"><div class="symbol">#</div><h3>Topic channels</h3><p>Organize homework help, projects, and announcements.</p></article><article class="card"><div class="symbol">✉</div><h3>Private messages</h3><p>One-to-one conversations with account and safety controls.</p></article></div><div class="sectiontitle"><h2>Available channels</h2><button class="btn" data-view="classes">View classes</button></div><div class="list">'+(state.channels.slice(0,8).map(c=>'<div class="listrow"><span class="tag"># '+esc(c.name)+'</span><div class="details"><strong>'+esc(c.name)+'</strong><small>'+esc(c.description||"Class conversation")+'</small></div><button class="btn" data-channel="'+esc(c.id)+'">Open</button></div>').join("")||'<div class="empty">No channels yet. An administrator can create classes and channels.</div>')+'</div></div>';bindViewButtons();return}
if(view==="classes"){main.innerHTML=head("Classes & channels","Find a class space or start a topic discussion.",'<button class="btn" id="refreshChannels">Refresh</button>')+'<div class="content"><section class="welcome"><h2>Learn together.</h2><p>Each class can have dedicated topic channels for questions, announcements, and group projects.</p></section><div class="list">'+(state.channels.map(c=>'<div class="listrow"><span class="tag"># '+esc(c.name)+'</span><div class="details"><strong>'+esc(c.name)+'</strong><small>'+esc(c.description||"Class channel")+'</small></div><button class="btn primary" data-channel="'+esc(c.id)+'">Open chat</button></div>').join("")||'<div class="empty">No class channels have been added yet.</div>')+'</div></div>';$("#refreshChannels").onclick=()=>loadChannels();bindViewButtons();return}
if(view==="dms"){renderDMs();return}
if(view==="admin"){renderAdmin();return}
if(view==="audit"){renderAudit();return}if(view==="users"){renderUsers();return}if(view==="reports"){renderReports();return}
if(view==="profile"){main.innerHTML=head("Your profile","Account and access information.")+'<div class="content"><div class="list"><div class="listrow"><div class="details"><strong>Username</strong><small>'+esc(state.user.username)+'</small></div></div><div class="listrow"><div class="details"><strong>Role</strong><small>'+esc(state.user.role)+'</small></div></div><div class="listrow"><div class="details"><strong>Account ID</strong><small>'+esc(state.user.id)+'</small></div></div></div></div>';return}
if(view==="study"){main.innerHTML=head("Study groups","Small spaces for collaborative learning.")+'<div class="content"><div class="empty">Study groups can be added by an administrator or class teacher.</div></div>';return}
if(view==="search"){renderSearch(query);return}
}
function bindViewButtons(){document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>navigate(b.dataset.view));document.querySelectorAll("[data-channel]").forEach(b=>b.onclick=()=>openChannel(b.dataset.channel))}
async function loadChannels(){try{const d=await api("/channels");state.channels=d.channels||[];renderChannels();if(state.view==="classes"||state.view==="home")navigate(state.view)}catch(e){console.error(e)}}
async function openChannel(id){let c=state.channels.find(x=>String(x.id)===String(id));if(!c)return;state.channel=c;state.view="channel";const main=$("#main");main.innerHTML=head("# "+esc(c.name),esc(c.description||"Class conversation"),'<button class="btn" id="channelRefresh">Refresh</button>')+'<div class="chatlayout"><section class="chatmain"><div class="chatmessages" id="chatmessages"><div class="empty">Loading messages…</div></div><div class="composer"><form id="sendMessage"><textarea name="content" maxlength="4000" required placeholder="Message #'+esc(c.name)+'… (Enter to send, Shift+Enter for a new line)"></textarea><button class="btn primary" type="submit">Send</button></form><small style="color:var(--muted)">Be respectful. Messages may be reported to school moderators.</small></div></section><aside class="members"><h3>CHANNEL INFO</h3><p style="color:var(--muted)">'+esc(c.description||"Class discussion channel")+'</p><h3 style="margin-top:25px">SAFETY</h3><p style="color:var(--muted);font-size:12px">Never share passwords or sensitive personal information in chat.</p></aside></div>';$("#channelRefresh").onclick=()=>loadMessages(id);$("#sendMessage").onsubmit=async e=>{e.preventDefault();const ta=e.target.content;const content=ta.value.trim();if(!content)return;const btn=e.submitter;btn.disabled=true;try{await api("/channels/"+encodeURIComponent(id)+"/messages",{method:"POST",body:JSON.stringify({content})});ta.value="";await loadMessages(id)}catch(err){alert(err.message)}finally{btn.disabled=false}};const ta=$("#sendMessage textarea");ta.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#sendMessage").requestSubmit()}};await loadMessages(id)}
async function loadMessages(id){const el=$("#chatmessages");if(!el)return;try{const d=await api("/channels/"+encodeURIComponent(id)+"/messages");state.messages=d.messages||[];el.innerHTML=state.messages.map(m=>'<article class="message"><div class="avatar">'+esc(initials(m.username))+'</div><div><div class="messagehead"><strong>'+esc(m.username)+'</strong><small>'+esc(new Date(m.created_at).toLocaleString())+'</small></div><p>'+esc(m.content)+'</p><button class="btn" type="button" data-report-message="'+esc(m.id)+'">Report message</button></div></article>').join("")||'<div class="empty">No messages yet. Start the conversation.</div>';el.querySelectorAll("[data-report-message]").forEach(b=>b.onclick=async()=>{const reason=prompt("Why are you reporting this message? Do not include private information.");if(!reason||!reason.trim())return;try{await api("/reports",{method:"POST",body:JSON.stringify({target_type:"channel_message",target_id:b.dataset.reportMessage,reason:reason.trim()})});alert("Report submitted to the moderation team.")}catch(e){alert(e.message)}});el.scrollTop=el.scrollHeight}catch(e){el.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function renderDMs(){const main=$("#main");main.innerHTML=head("Private messages","Direct conversations are only visible to their participants.",'<button class="btn" id="newDM">New message</button>')+'<div class="content"><div id="dmList" class="list"><div class="empty">Loading conversations…</div></div><div id="dmOpen"></div></div>';$("#newDM").onclick=async()=>{const username=prompt("Enter the exact username of the person you want to message:");if(!username)return;try{const d=await api("/dms",{method:"POST",body:JSON.stringify({username})});openDM(d.conversation.id,d.conversation.username)}catch(e){alert(e.message)}};try{const d=await api("/dms");state.dms=d.conversations||[];$("#dmList").innerHTML=state.dms.map(c=>'<button class="listrow" style="width:100%;background:transparent;color:inherit;text-align:left;border-top:0;border-left:0;border-right:0" data-dm="'+esc(c.id)+'"><div class="avatar">'+esc(initials(c.username))+'</div><div class="details"><strong>'+esc(c.username)+'</strong><small>'+esc(c.last_message||"No messages yet")+'</small></div><small>'+esc(c.updated_at?new Date(c.updated_at).toLocaleDateString():"")+'</small></button>').join("")||'<div class="empty">No conversations yet. Select “New message” to start one.</div>';$("#dmList").querySelectorAll("[data-dm]").forEach(b=>b.onclick=()=>{const c=state.dms.find(x=>String(x.id)===b.dataset.dm);openDM(c.id,c.username)})}catch(e){$("#dmList").innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function openDM(id,username){const wrap=$("#dmOpen");wrap.innerHTML='<div class="sectiontitle"><h2>Conversation with '+esc(username)+'</h2></div><div class="list" id="dmMessages"><div class="empty">Loading…</div></div><form id="dmSend" style="display:flex;gap:8px;margin-top:12px"><input name="content" maxlength="4000" required placeholder="Write a private message…" style="flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:11px"><button class="btn primary">Send</button></form>';async function refresh(){try{const d=await api("/dms/"+encodeURIComponent(id)+"/messages");$("#dmMessages").innerHTML=(d.messages||[]).map(m=>'<div class="listrow"><div class="details"><strong>'+esc(m.username)+' <small style="font-weight:400;color:var(--muted)">'+esc(new Date(m.created_at).toLocaleString())+'</small></strong><div>'+esc(m.content)+'</div></div></div>').join("")||'<div class="empty">Say hello to start the conversation.</div>'}catch(e){$("#dmMessages").innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}await refresh();$("#dmSend").onsubmit=async e=>{e.preventDefault();const inp=e.target.content;try{await api("/dms/"+encodeURIComponent(id)+"/messages",{method:"POST",body:JSON.stringify({content:inp.value})});inp.value="";await refresh()}catch(err){alert(err.message)}}}
async function renderAdmin(){const main=$("#main");main.innerHTML=head("Administration","Manage accounts, classes, channels, and audit events.")+'<div class="content"><section class="welcome"><h2>Campusly control center</h2><p>Privileged actions are checked by the server and recorded in the audit trail.</p></section><div class="cards"><article class="card"><h3>Create a class</h3><p>Add a class space. You will be added as a teacher.</p><form id="createClass"><div class="field"><label>Class name</label><input name="name" required maxlength="100" placeholder="e.g. Algebra 1"></div><div class="field"><label>Description</label><input name="description" maxlength="500" placeholder="Optional class description"></div><button class="btn primary">Create class</button><div id="classResult" class="notice"></div></form></article><article class="card"><h3>Create a channel</h3><p>Add a topic channel to a class you manage.</p><form id="createChannel"><div class="field"><label>Class</label><select name="class_id" id="classSelect" required><option value="">Loading classes…</option></select></div><div class="field"><label>Channel name</label><input name="name" required maxlength="80" placeholder="homework-help"></div><div class="field"><label>Description</label><input name="description" maxlength="500" placeholder="Optional description"></div><button class="btn primary">Create channel</button><div id="channelResult" class="notice"></div></form></article><article class="card"><h3>Enroll a member</h3><p>Add an existing account to a class so they can see its channels.</p><form id="addMember"><div class="field"><label>Class</label><select name="class_id" id="memberClassSelect" required><option value="">Loading classes…</option></select></div><div class="field"><label>Username</label><input name="username" required maxlength="64" placeholder="student.username"></div><div class="field"><label>Class role</label><select name="class_role"><option value="student">Student</option><option value="teacher">Teacher</option></select></div><button class="btn primary">Add to class</button><div id="memberResult" class="notice"></div></form></article></div><div class="sectiontitle"><h2>Existing classes</h2><button class="btn" id="reloadClasses">Refresh</button></div><div class="list" id="classList"><div class="empty">Loading classes…</div></div></div>';bindViewButtons();async function refreshClasses(){try{const d=await api("/admin/classes");const classes=d.classes||[];const options='<option value="">Choose a class…</option>'+classes.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join("");$("#classSelect").innerHTML=options;$("#memberClassSelect").innerHTML=options;$("#classList").innerHTML=classes.map(c=>'<div class="listrow"><div class="details"><strong>'+esc(c.name)+'</strong><small>'+esc(c.description||"No description")+'</small></div><span class="tag">Class</span></div>').join("")||'<div class="empty">No classes created yet.</div>'}catch(e){$("#classList").innerHTML='<div class="empty">'+esc(e.message)+'</div>';$("#classSelect").innerHTML='<option value="">Could not load classes</option>'}}$("#reloadClasses").onclick=refreshClasses;$("#createClass").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const out=$("#classResult");try{await api("/admin/classes",{method:"POST",body:JSON.stringify({name:f.get("name"),description:f.get("description")})});out.textContent="Class created.";e.target.reset();await refreshClasses();await loadChannels()}catch(err){out.textContent=err.message}};$("#createChannel").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const out=$("#channelResult");try{await api("/admin/channels",{method:"POST",body:JSON.stringify({class_id:f.get("class_id"),name:f.get("name"),description:f.get("description")})});out.textContent="Channel created.";e.target.reset();await refreshClasses();await loadChannels()}catch(err){out.textContent=err.message}};$("#addMember").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const out=$("#memberResult");try{await api("/admin/classes/"+encodeURIComponent(f.get("class_id"))+"/members",{method:"POST",body:JSON.stringify({username:f.get("username"),class_role:f.get("class_role")})});out.textContent="Member added to class.";e.target.reset();await loadChannels()}catch(err){out.textContent=err.message}};await refreshClasses()}
async function renderSearch(query){
 const main=$("#main");main.innerHTML=head("Search results","Searching spaces and messages you are allowed to access.")+'<div class="content"><div id="searchResults" class="list"><div class="empty">Searching…</div></div></div>';
 const out=$("#searchResults");
 try{
  const d=await api("/search?q="+encodeURIComponent(query));
  const channels=d.channels||[],messages=d.messages||[],dms=d.direct_messages||[];
  let html="";
  if(channels.length)html+='<div class="sectiontitle"><h2>Channels</h2></div>'+channels.map(c=>'<button class="listrow" style="width:100%;text-align:left;color:inherit" data-search-channel="'+esc(c.id)+'"><div class="details"><strong># '+esc(c.name)+'</strong><small>'+esc(c.class_name)+' · '+esc(c.description||"Class channel")+'</small></div></button>').join("");
  if(messages.length)html+='<div class="sectiontitle"><h2>Channel messages</h2></div>'+messages.map(m=>'<div class="listrow"><div class="details"><strong>'+esc(m.username)+' in #'+esc(m.channel_name)+' · '+esc(m.class_name)+'</strong><small>'+esc(new Date(m.created_at).toLocaleString())+'</small><div>'+esc(m.content)+'</div></div><button class="btn" data-search-channel="'+esc(m.channel_id)+'">Open</button></div>').join("");
  if(dms.length)html+='<div class="sectiontitle"><h2>Private messages</h2><p>Only messages from your own conversations are included.</p></div>'+dms.map(m=>'<div class="listrow"><div class="details"><strong>'+esc(m.username)+' · Private message</strong><small>'+esc(new Date(m.created_at).toLocaleString())+'</small><div>'+esc(m.content)+'</div></div></div>').join("");
  out.innerHTML=html||'<div class="empty">No matching results. Try a different search.</div>';
  out.querySelectorAll("[data-search-channel]").forEach(b=>b.onclick=()=>openChannel(b.dataset.searchChannel));
 }catch(e){out.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}
async function renderReports(){
 const main=$("#main");main.innerHTML=head("Report queue","Review safety reports and update their status.")+'<div class="content"><div id="reportList" class="list"><div class="empty">Loading reports…</div></div></div>';
 const out=$("#reportList");
 try{
  const d=await api("/admin/reports");const reports=d.reports||[];
  out.innerHTML=reports.map(r=>'<article class="listrow"><div class="details"><strong>'+esc(r.target_type.replace(/_/g," "))+' · '+esc(r.status)+'</strong><small>Reported by '+esc(r.reporter)+' · '+esc(new Date(r.created_at).toLocaleString())+'</small><p>'+esc(r.reason)+'</p><small>Target ID: '+esc(r.target_id)+'</small></div><select class="btn" data-report-status="'+esc(r.id)+'" aria-label="Report status"><option value="open" '+(r.status==="open"?"selected":"")+' >Open</option><option value="reviewing" '+(r.status==="reviewing"?"selected":"")+' >Reviewing</option><option value="resolved" '+(r.status==="resolved"?"selected":"")+' >Resolved</option><option value="dismissed" '+(r.status==="dismissed"?"selected":"")+' >Dismissed</option></select></article>').join("")||'<div class="empty">No reports have been submitted.</div>';
  out.querySelectorAll("[data-report-status]").forEach(sel=>sel.onchange=async()=>{const status=sel.value;sel.disabled=true;try{await api("/admin/reports/"+encodeURIComponent(sel.dataset.reportStatus),{method:"PATCH",body:JSON.stringify({status})});await renderReports()}catch(e){alert(e.message);await renderReports()}});
 }catch(e){out.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}
async function renderAudit(){const main=$("#main");main.innerHTML=head("Audit logs","Security and administrative events. Sensitive content is intentionally excluded.")+'<div class="content"><div id="auditTable" class="list"><div class="empty">Loading logs…</div></div></div>';try{const d=await api("/admin/audit?limit=100");state.audit=d.events||[];$("#auditTable").innerHTML='<table class="audit" style="width:100%;border-collapse:collapse"><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>Result</th></tr></thead><tbody>'+state.audit.map(a=>'<tr><td>'+esc(new Date(a.created_at).toLocaleString())+'</td><td>'+esc(a.actor_username||"System")+'</td><td>'+esc(a.action)+'</td><td>'+esc(a.target||"—")+'</td><td>'+esc(a.result||"success")+'</td></tr>').join("")+'</tbody></table>'}catch(e){$("#auditTable").innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function renderUsers(){const main=$("#main");main.innerHTML=head("User management","Create accounts and review role assignments.")+'<div class="content"><section class="card" style="margin-bottom:18px"><h3>Create account</h3><p>Use a unique initial password and share it with the user through a secure method.</p><form id="createUser" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end"><div class="field"><label>Username</label><input name="username" required minlength="3" maxlength="64" pattern="[A-Za-z0-9._-]+" placeholder="student.username"></div><div class="field"><label>Initial password</label><input name="password" type="password" required minlength="14" autocomplete="new-password"></div><div class="field"><label>Role</label><select name="role"><option value="student">Student</option><option value="teacher">Teacher</option><option value="moderator">Moderator</option><option value="administrator">Administrator</option></select></div><button class="btn primary">Create account</button></form><div id="createUserResult" class="notice"></div></section><div id="userTable" class="list"><div class="empty">Loading users…</div></div></div>';$("#createUser").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const out=$("#createUserResult");try{await api("/admin/users",{method:"POST",body:JSON.stringify({username:f.get("username"),password:f.get("password"),role:f.get("role")})});out.textContent="Account created. The password is stored as a hash and will not be shown again.";e.target.reset();await renderUsers()}catch(err){out.textContent=err.message}};try{const d=await api("/admin/users");state.users=d.users||[];$("#userTable").innerHTML=state.users.map(u=>'<div class="listrow"><div class="avatar">'+esc(initials(u.username))+'</div><div class="details"><strong>'+esc(u.username)+'</strong><small>Created '+esc(new Date(u.created_at).toLocaleDateString())+'</small></div><select aria-label="Role for '+esc(u.username)+'" data-role-user="'+esc(u.id)+'" class="btn">'+["student","teacher","moderator","administrator"].map(r=>'<option '+(u.role===r?"selected":"")+'>'+r+'</option>').join("")+'</select><span class="tag">'+esc(u.status||"active")+'</span></div>').join("")||'<div class="empty">No users found.</div>';$("#userTable").querySelectorAll("[data-role-user]").forEach(sel=>sel.onchange=async()=>{if(!confirm("Change this user's role? This action will be logged.")){renderUsers();return}try{await api("/admin/users/"+encodeURIComponent(sel.dataset.roleUser)+"/role",{method:"PATCH",body:JSON.stringify({role:sel.value})});alert("Role updated.");renderUsers()}catch(e){alert(e.message);renderUsers()}})}catch(e){$("#userTable").innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function start(){try{const d=await api("/me");state.user=d.user;await loadChannels();shell()}catch(e){login()}}
start();
</script>
