<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d1117"><meta name="description" content="Campusly — school collaboration, class chats, and project spaces.">
<title>Campusly — School collaboration</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--panel2:#1c2128;--line:#30363d;--text:#e6edf3;--muted:#9198a1;--purple:#a78bfa;--blue:#79c0ff;--green:#3fb950;--red:#f85149}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:64px;display:flex;align-items:center;gap:16px;padding:0 22px;border-bottom:1px solid var(--line);background:#010409;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:19px;color:#fff;text-decoration:none;white-space:nowrap}.mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#a78bfa,#6d5dfc);color:#fff;font-weight:900}.search{max-width:510px;flex:1;position:relative}.search input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 12px 9px 35px;outline:none}.search:before{content:"⌕";position:absolute;left:12px;top:4px;font-size:23px;color:var(--muted)}.topright{margin-left:auto;display:flex;align-items:center;gap:12px}.avatar{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#3b2e65;color:#e9ddff;font-weight:700;overflow:hidden;flex-shrink:0}.avatar img{width:100%;height:100%;object-fit:cover;display:block}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;padding:8px 12px}.btn.primary{background:#8957e5;border-color:#8957e5;color:white}.btn:hover{filter:brightness(1.12)}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 64px)}.sidebar{border-right:1px solid var(--line);padding:18px 12px;background:#0d1117}.workspace{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:9px;margin-bottom:22px}.workspace .mark{width:30px;height:30px}.workspace strong{display:block}.workspace small{color:var(--muted)}.navlabel{color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.09em;padding:8px 10px}.navitem{width:100%;display:flex;align-items:center;gap:10px;text-align:left;color:#c9d1d9;padding:9px 10px;border:0;border-radius:7px;background:transparent;margin:2px 0}.navitem:hover,.navitem.active{background:#21262d;color:#fff}.navitem.active{box-shadow:inset 2px 0 var(--purple)}.navitem .count{margin-left:auto;color:var(--muted);font-size:12px}.channel{padding-left:20px}.main{min-width:0;display:flex;flex-direction:column}.pagehead{padding:22px 28px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.pagehead h1{font-size:20px;margin:0;font-weight:650}.pagehead p{color:var(--muted);margin:3px 0 0}.pagehead .actions{margin-left:auto;display:flex;gap:8px}.content{padding:24px 28px;max-width:1300px;width:100%;margin:0 auto}.welcome{padding:24px;border:1px solid var(--line);border-radius:12px;background:radial-gradient(ellipse at top right,#33245b55,transparent 48%),var(--panel);margin-bottom:22px}.welcome h2{margin:0 0 6px;font-size:25px}.welcome p{margin:0;color:var(--muted);max-width:680px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0 24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:17px}.card .symbol{font-size:20px;margin-bottom:12px}.card h3{margin:0 0 5px;font-size:15px}.card p{margin:0;color:var(--muted);font-size:13px}.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.sectiontitle h2{font-size:16px;margin:0}.list{border:1px solid var(--line);border-radius:10px;overflow:hidden}.listrow{padding:13px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.listrow:last-child{border:0}.listrow .details{flex:1;min-width:0}.listrow strong{display:block}.listrow small{color:var(--muted)}.tag{font-size:11px;color:#d2c1ff;background:#382a58;padding:3px 7px;border-radius:20px}.chatlayout{display:grid;grid-template-columns:minmax(0,1fr) 235px;min-height:calc(100vh - 145px)}.chatmain{display:flex;flex-direction:column;min-height:500px;min-width:0}.chatmessages{padding:22px 28px;flex:1}.message{display:flex;gap:12px;margin:0 0 22px}.message .avatar{flex-shrink:0}.messagehead{display:flex;gap:9px;align-items:center}.messagehead small{color:var(--muted)}.message p{margin:4px 0 0;color:#d1d7e0;white-space:pre-wrap;overflow-wrap:anywhere}.composer{padding:14px 24px 22px;border-top:1px solid var(--line)}.composer form{display:flex;gap:9px}.composer textarea{resize:vertical;min-height:44px;max-height:150px;flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:12px;outline:none}.members{border-left:1px solid var(--line);padding:20px 14px;background:#0b0f14}.members h3{font-size:11px;color:var(--muted);letter-spacing:.08em;margin:0 0 13px}.member{display:flex;gap:9px;align-items:center;margin:12px 0}.member .avatar{width:27px;height:27px;font-size:11px}.member small{display:block;color:var(--muted)}.empty{padding:45px 20px;text-align:center;color:var(--muted)}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0,#33245b66,transparent 55%),var(--bg)}.loginbox{width:min(420px,100%);border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:28px}.loginbox .brand{justify-content:center;margin-bottom:25px}.loginbox h1{text-align:center;font-size:22px;margin:0 0 6px}.loginbox>p{text-align:center;color:var(--muted);margin:0 0 22px}.field{margin:14px 0}.field label{display:block;margin-bottom:6px;font-weight:600}.field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text)}.loginbox .btn{width:100%;margin-top:8px}.notice{font-size:12px;color:var(--muted);margin-top:16px}.error{color:#ff938a;margin-top:10px}.audit{font-size:13px;overflow:auto}.audit th,.audit td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}.audit th{color:var(--muted);font-weight:600}.hidden{display:none!important}.mobiletoggle{display:none}
@media(max-width:850px){.layout{grid-template-columns:210px minmax(0,1fr)}.cards{grid-template-columns:1fr}.chatlayout{grid-template-columns:minmax(0,1fr)}.members{display:none}.content{padding:18px}.pagehead{padding:18px}.chatmessages{padding:18px}.top{padding:0 12px;gap:10px}}
@media(max-width:620px){.layout{display:block}.sidebar{display:none;border-bottom:1px solid var(--line)}.sidebar.open{display:block}.mobiletoggle{display:inline-flex}.topright .desktop{display:none}.pagehead{align-items:flex-start;flex-wrap:wrap}.pagehead .actions{margin-left:0;width:100%}.pagehead .actions .btn{flex:1}.search{max-width:none}.brand span:last-child{display:none}.content{padding:14px}.welcome{padding:18px}.chatmessages{padding:16px}.composer{padding:12px}.topright{gap:7px}}

/* Cross-device layout consistency */
html{min-height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-width:320px;min-height:100vh;overflow-x:hidden}
#app{min-height:100vh}
button,input,textarea,select{min-width:0}
button{touch-action:manipulation}
img,video,canvas,svg{max-width:100%}
.layout{width:100%;min-width:0}
.sidebar,.main,.content,.chatlayout,.chatmain,.chatmessages,.composer,.members{min-width:0}
.content{overflow-wrap:anywhere}
.pagehead h1,.pagehead p,.workspace strong,.workspace small,.listrow .details,.messagehead{min-width:0;overflow-wrap:anywhere}
.pagehead .actions{flex-wrap:wrap}
.chatlayout{min-height:calc(100dvh - 145px)}
.chatmain{min-height:0;height:calc(100dvh - 145px)}
.chatmessages{min-height:180px;overflow-y:auto;overscroll-behavior:contain}
.composer{position:sticky;bottom:0;background:var(--bg);z-index:2}
.composer form{align-items:flex-end}
.composer textarea{min-width:0}
.audit{display:block;max-width:100%;overflow-x:auto}
#serverList,#userTable,#auditTable{min-width:0;max-width:100%}
.field input,.field select,.field textarea{max-width:100%}
@media(min-width:1100px){
 .layout{grid-template-columns:250px minmax(0,1fr)}
 .sidebar{display:block!important}
 .content{padding:26px 32px}
 .chatlayout{grid-template-columns:minmax(0,1fr) 235px}
 .members{display:block}
 .chatmessages{padding:24px clamp(22px,3vw,44px)}
 .composer{padding:16px clamp(22px,3vw,44px) 22px}
}
@media(min-width:851px) and (max-width:1099px){
 .layout{grid-template-columns:220px minmax(0,1fr)}
 .sidebar{display:block!important}
 .chatlayout{grid-template-columns:minmax(0,1fr)}
 .members{display:none}
 .content{padding:22px}
 .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
 .chatmain{height:calc(100dvh - 145px)}
}
@media(max-width:850px){
 .chatmain{height:calc(100dvh - 130px)}
 .chatlayout{min-height:calc(100dvh - 130px)}
 .cards{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
 .pagehead{gap:10px}
 .pagehead .actions{flex-wrap:wrap}
}
@media(max-width:620px){
 .top{height:58px;padding:0 10px;gap:8px}
 .topright{gap:6px}
 .topright .avatar{width:29px;height:29px}
 .layout{display:block;min-height:calc(100dvh - 58px)}
 .sidebar{display:none!important;padding:12px}
 .sidebar.open{display:block!important}
 .main{width:100%}
 .pagehead{padding:14px;gap:8px}
 .pagehead h1{font-size:19px}
 .pagehead .actions{width:100%;margin-left:0}
 .pagehead .actions .btn{flex:1}
 .content{padding:12px}
 .cards{grid-template-columns:minmax(0,1fr);gap:10px}
 .card{padding:14px}
 .welcome{padding:16px}
 .welcome h2{font-size:21px}
 .chatlayout{display:flex;flex-direction:column;min-height:calc(100dvh - 125px)}
 .chatmain{height:calc(100dvh - 125px);min-height:280px}
 .chatmessages{padding:14px 12px}
 .message{gap:9px}
 .messagehead{flex-wrap:wrap;gap:5px}
 .composer{padding:10px;background:var(--bg)}
 .composer form{gap:7px}
 .composer textarea{padding:10px;min-height:42px}
 .listrow{padding:11px;gap:9px;flex-wrap:wrap}
 .listrow .details{flex:1 1 180px}
 .search{min-width:0}
 .search input{padding:8px 8px 8px 30px}
 .loginbox{padding:22px}
}
@media(max-width:380px){
 .top{gap:6px}
 .brand{font-size:16px;gap:6px}
 .mark{width:30px;height:30px}
 .topright .btn{padding:7px 8px}
 .mobiletoggle{padding:7px 9px}
 .chatmessages{padding:12px 9px}
 .message .avatar{width:28px;height:28px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}

</style>
</head>
<body>
<div id="app"><div class="loginwrap"><div class="loginbox"><a class="brand"><span class="mark">C</span><span>Campusly</span></a><h1>School collaboration, together.</h1><p>Loading your workspace…</p></div></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state={user:null,channels:[],servers:[],channel:null,messages:[],view:"home",dms:[],dmOpenId:null,audit:[],users:[],error:""};
async function api(path,options={}){const r=await fetch("/api"+path,{credentials:"same-origin",headers:{"content-type":"application/json",...(options.headers||{})},...options});let data={};try{data=await r.json()}catch{}if(!r.ok)throw Error(data.error||"Request failed");return data}
function initials(s){return String(s||"?").slice(0,2).toUpperCase()}
function avatarHTML(username,avatarUrl,extra="avatar"){return avatarUrl?'<div class="'+extra+'"><img src="'+esc(avatarUrl)+'" alt="" referrerpolicy="no-referrer"></div>':'<div class="'+extra+'">'+esc(initials(username))+'</div>'}
function brand(){return '<a class="brand" href="#" data-view="home"><span class="mark">C</span><span>Campusly</span></a>'}
function login(){ $("#app").innerHTML='<div class="loginwrap"><form class="loginbox" id="loginForm">'+brand()+'<h1>Welcome back</h1><p>Sign in to your school workspace.</p><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="64"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn primary" type="submit">Sign in</button><div id="loginError" class="error" role="alert"></div><div class="notice">Campusly administrators will never ask you to share your password.</div></form></div>';$("#loginForm").onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;$("#loginError").textContent="";try{await api("/auth/login",{method:"POST",body:JSON.stringify({username:$("#username").value,password:$("#password").value})});await start()}catch(err){$("#loginError").textContent=err.message}finally{b.disabled=false}}}
function shell(){const role=state.user.role;const active=(v)=>state.view===v?" active":"";$("#app").innerHTML='<header class="top"><button class="btn mobiletoggle" id="mobiletoggle" aria-label="Toggle navigation">☰</button>'+brand()+'<div class="search"><input id="globalSearch" placeholder="Search classes, channels, and messages…" aria-label="Search Campusly"></div><div class="topright"><button class="btn desktop" data-view="dms">✉ Messages</button><button class="btn" id="logout">Sign out</button>'+'<button class="btn" data-view="profile" aria-label="Customize profile" title="Customize profile">'+avatarHTML(state.user.username,state.user.avatar_url)+'</button></div></header><div class="layout"><aside class="sidebar" id="sidebar"><div class="workspace"><span class="mark">C</span><div><strong>Campusly</strong><small>'+esc(role)+' workspace</small></div></div><div class="navlabel">WORKSPACE</div><button class="navitem'+active("home")+'" data-view="home">⌂ Overview</button><button class="navitem'+active("servers")+'" data-view="servers">▤ My servers</button><button class="navitem'+active("classes")+'" data-view="classes"># Browse channels</button><button class="navitem'+active("dms")+'" data-view="dms">✉ Private messages</button><button class="navitem'+active("study")+'" data-view="study">◎ Study groups</button><div class="navlabel">YOUR CHANNELS</div><div id="channelNav"></div><button class="navitem" data-view="classes">＋ Browse classes</button>'+(["administrator"].includes(role)?'<div class="navlabel">ADMINISTRATION</div><button class="navitem'+active("admin")+'" data-view="admin">⚙ Admin dashboard</button><button class="navitem'+active("audit")+'" data-view="audit">▤ Audit logs</button><button class="navitem'+active("users")+'" data-view="users">♙ User management</button>':"")+(["moderator","administrator"].includes(role)?'<div class="navlabel">SAFETY</div><button class="navitem'+active("reports")+'" data-view="reports">⚑ Report queue</button>':"")+'<div class="navlabel">ACCOUNT</div><button class="navitem" data-view="profile">◉ My profile</button></aside><main class="main" id="main"></main></div>';
$("#logout").onclick=async()=>{try{await api("/auth/logout",{method:"POST",body:"{}"})}finally{state.user=null;login()}};
$("#mobiletoggle").onclick=()=>$("#sidebar").classList.toggle("open");
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{navigate(b.dataset.view);$("#sidebar")?.classList.remove("open")}));
renderChannels();navigate(state.view);
$("#globalSearch").onkeydown=e=>{if(e.key==="Enter"&&e.target.value.trim())navigate("search",e.target.value.trim())}
}
function renderChannels(){const el=$("#channelNav");if(!el)return;el.innerHTML=state.channels.slice(0,14).map(c=>'<button class="navitem channel" data-channel="'+esc(c.id)+'"># '+esc(c.name)+' <small style="color:var(--muted)">· '+esc(c.class_name||"Server")+'</small></button>').join("")||'<div style="padding:8px 10px;color:var(--muted);font-size:12px">Join a class to see channels.</div>';el.querySelectorAll("[data-channel]").forEach(b=>b.onclick=()=>openChannel(b.dataset.channel))}
function head(title,sub,actions=""){return '<div class="pagehead"><div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="actions">'+actions+'</div></div>'}
function navigate(view,query=""){state.view=view;const main=$("#main");if(!main)return;document.querySelectorAll(".navitem[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));if(view==="home"){main.innerHTML=head("Overview","Your school community at a glance.")+'<div class="content"><section class="welcome"><h2>Welcome to Campusly, '+esc(state.user.username)+'.</h2><p>A shared space for classes, discussions, study groups, and school projects. Pick a channel to join the conversation.</p></section><div class="cards"><article class="card"><div class="symbol">▤</div><h3>Class spaces</h3><p>Keep class resources and conversations together.</p></article><article class="card"><div class="symbol">#</div><h3>Topic channels</h3><p>Organize homework help, projects, and announcements.</p></article><article class="card"><div class="symbol">✉</div><h3>Private messages</h3><p>One-to-one conversations with account and safety controls.</p></article></div><div class="sectiontitle"><h2>Available channels</h2><button class="btn" data-view="classes">View classes</button></div><div class="list">'+(state.channels.slice(0,8).map(c=>'<div class="listrow"><span class="tag"># '+esc(c.name)+'</span><div class="details"><strong>'+esc(c.name)+' · '+esc(c.class_name||"Server")+'</strong><small>'+esc(c.description||"Class conversation")+'</small></div><button class="btn" data-channel="'+esc(c.id)+'">Open</button></div>').join("")||'<div class="empty">No channels yet. An administrator can create classes and channels.</div>')+'</div></div>';bindViewButtons();return}
if(view==="classes"){renderClassCatalog();return}
if(view==="dms"){renderDMs();return}
if(view==="admin"){renderAdmin();return}
if(view==="audit"){renderAudit();return}if(view==="users"){renderUsers();return}if(view==="reports"){renderReports();return}
if(view==="profile"){renderProfile();return}
if(view==="servers"){renderServers();return}
if(view==="study"){main.innerHTML=head("Study groups","Small spaces for collaborative learning.")+'<div class="content"><div class="empty">Study groups can be added by an administrator or class teacher.</div></div>';return}
if(view==="search"){renderSearch(query);return}
}
function bindViewButtons(){document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>navigate(b.dataset.view));document.querySelectorAll("[data-channel]").forEach(b=>b.onclick=()=>openChannel(b.dataset.channel))}
async function loadChannels(){try{const d=await api("/channels");state.channels=d.channels||[];renderChannels();if(state.view==="classes"||state.view==="home")navigate(state.view)}catch(e){console.error(e)}}
async function openChannel(id){let c=state.channels.find(x=>String(x.id)===String(id));if(!c)return;state.channel=c;state.messages=[];state.view="channel";const main=$("#main");main.innerHTML=head("# "+esc(c.name),esc(c.class_name||"Server")+" · "+esc(c.description||"Class conversation"),'<button class="btn" id="channelRefresh">Refresh</button>')+'<div class="chatlayout"><section class="chatmain"><div class="chatmessages" id="chatmessages"><div class="empty">Loading messages…</div></div><div class="composer"><form id="sendMessage"><textarea name="content" maxlength="4000" required placeholder="Message #'+esc(c.name)+'… (Enter to send, Shift+Enter for a new line)"></textarea><button class="btn primary" type="submit">Send</button></form><small style="color:var(--muted)">Be respectful. Messages may be reported to school moderators.</small></div></section><aside class="members"><h3>CHANNEL INFO</h3><p style="color:var(--muted)">'+esc(c.description||"Class discussion channel")+'</p><h3 style="margin-top:25px">SAFETY</h3><p style="color:var(--muted);font-size:12px">Never share passwords or sensitive personal information in chat.</p></aside></div>';$("#channelRefresh").onclick=()=>loadMessages(id);$("#sendMessage").onsubmit=async e=>{e.preventDefault();const ta=e.target.content;const content=ta.value.trim();if(!content)return;const btn=e.submitter;btn.disabled=true;try{await api("/channels/"+encodeURIComponent(id)+"/messages",{method:"POST",body:JSON.stringify({content})});ta.value="";await loadMessages(id)}catch(err){alert(err.message)}finally{btn.disabled=false}};const ta=$("#sendMessage textarea");ta.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#sendMessage").requestSubmit()}};await loadMessages(id)}
async function loadMessages(id){const el=$("#chatmessages");if(!el)return;try{const d=await api("/channels/"+encodeURIComponent(id)+"/messages");const incoming=d.messages||[];if(incoming.length===state.messages.length&&incoming.every((m,i)=>m.id===state.messages[i]?.id))return;const wasAtBottom=el.scrollHeight-el.scrollTop-el.clientHeight<80;state.messages=incoming;el.innerHTML=state.messages.map(m=>'<article class="message">'+avatarHTML(m.username,m.avatar_url)+'<div><div class="messagehead"><strong>'+esc(m.display_name||m.username)+'</strong><small>@'+esc(m.username)+' · '+esc(new Date(m.created_at).toLocaleString())+'</small></div><p>'+esc(m.content)+'</p><button class="btn" type="button" data-report-message="'+esc(m.id)+'">Report message</button></div></article>').join("")||'<div class="empty">No messages yet. Start the conversation.</div>';el.querySelectorAll("[data-report-message]").forEach(b=>b.onclick=async()=>{const reason=prompt("Why are you reporting this message? Do not include private information.");if(!reason||!reason.trim())return;try{await api("/reports",{method:"POST",body:JSON.stringify({target_type:"channel_message",target_id:b.dataset.reportMessage,reason:reason.trim()})});alert("Report submitted to the moderation team.")}catch(e){alert(e.message)}});if(wasAtBottom)el.scrollTop=el.scrollHeight}catch(e){el.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}

 const main=$("#main");
 main.innerHTML=head("Your servers","Separate communities with their own members and channels.")+'<div class="content"><div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><article class="card"><h3>Create a server</h3><p>Create a private community with its own member list and general channel.</p><form id="createServer"><div class="field"><label>Server name</label><input name="name" required maxlength="80" placeholder="e.g. AP Human Geography"></div><div class="field"><label>Description</label><input name="description" maxlength="500" placeholder="What is this server for?"></div><button class="btn primary">Create server</button><div class="notice" id="createServerResult"></div></form></article><article class="card"><h3>Join a server</h3><p>Enter an invite code from a server member. You will only see chats in servers you have joined.</p><form id="joinServer"><div class="field"><label>Invite code</label><input name="invite_code" required minlength="8" maxlength="10" placeholder="e.g. a1b2c3d4"></div><button class="btn">Join server</button><div class="notice" id="joinServerResult"></div></form></article></div><div class="sectiontitle"><h2>Servers you belong to</h2><button class="btn" id="refreshServers">Refresh</button></div><div id="serverList" class="list"><div class="empty">Loading your servers…</div></div></div>';
 async function refresh(){const out=$("#serverList");try{const d=await api("/servers");state.servers=d.servers||[];out.innerHTML=state.servers.map(s=>{const channels=state.channels.filter(ch=>String(ch.class_id)===String(s.id));return '<article class="listrow" style="align-items:flex-start"><div class="mark" style="flex-shrink:0">S</div><div class="details"><strong>'+esc(s.name)+'</strong><small>'+esc(s.description||"Campusly server")+' · '+esc(s.member_count)+' member(s) · '+esc(s.server_role)+'</small><div style="margin-top:8px"><strong style="display:inline;font-size:12px">Invite code: </strong><code>'+esc(s.invite_code)+'</code> <button class="btn" data-copy-code="'+esc(s.invite_code)+'" type="button">Copy</button></div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">'+(channels.map(ch=>'<button class="btn" data-server-channel="'+esc(ch.id)+'"># '+esc(ch.name)+'</button>').join("")||'<small style="color:var(--muted)">No channels yet.</small>')+((s.server_role==="teacher"||state.user.role==="administrator")?'<button class="btn" data-create-channel="'+esc(s.id)+'">＋ Create channel</button>':"")+'</div></div></article>'}).join("")||'<div class="empty">You have not joined any servers yet. Create one or join with an invite code.</div>';out.querySelectorAll("[data-server-channel]").forEach(b=>b.onclick=()=>openChannel(b.dataset.serverChannel));out.querySelectorAll("[data-create-channel]").forEach(b=>b.onclick=async()=>{const name=prompt("New channel name (letters, numbers, and hyphens):");if(!name||!name.trim())return;const description=prompt("Channel description (optional):")||"";try{await api("/admin/channels",{method:"POST",body:JSON.stringify({class_id:b.dataset.createChannel,name:name.trim(),description})});await loadChannels();await refresh()}catch(e){alert(e.message)}});out.querySelectorAll("[data-copy-code]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copyCode);b.textContent="Copied"}catch{prompt("Copy this invite code:",b.dataset.copyCode)}})}catch(e){out.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
 $("#refreshServers").onclick=async()=>{await loadChannels();await refresh()};
 $("#createServer").onsubmit=async e=>{e.preventDefault();const f=e.target;const out=$("#createServerResult");try{const d=await api("/servers",{method:"POST",body:JSON.stringify({name:f.name.value.trim(),description:f.description.value.trim()})});out.textContent="Server created. Share its invite code with people you want to invite: "+d.server.invite_code;f.reset();await loadChannels();await refresh()}catch(err){out.textContent=err.message}};
 $("#joinServer").onsubmit=async e=>{e.preventDefault();const f=e.target;const out=$("#joinServerResult");try{const d=await api("/servers/join",{method:"POST",body:JSON.stringify({invite_code:f.invite_code.value.trim()})});out.textContent="Joined "+d.server.name+".";f.reset();await loadChannels();await refresh()}catch(err){out.textContent=err.message}};
 await refresh();
}
async function start(){try{const d=await api("/me");state.user=d.user;await loadChannels();shell()}catch(e){login()}}
async function refreshOpenDM(){const id=state.dmOpenId;const el=$("#dmMessages");if(!id||!el||state.view!=="dms")return;try{const d=await api("/dms/"+encodeURIComponent(id)+"/messages");const messages=d.messages||[];const key=messages.map(m=>m.id).join("|");if(el.dataset.messageKey===key)return;const wasAtBottom=el.scrollHeight-el.scrollTop-el.clientHeight<80;el.dataset.messageKey=key;el.innerHTML=messages.map(m=>'<div class="listrow"><div class="details"><strong>'+esc(m.username)+' <small style="font-weight:400;color:var(--muted)">'+esc(new Date(m.created_at).toLocaleString())+'</small></strong><div>'+esc(m.content)+'</div></div></div>').join("")||'<div class="empty">Say hello to start the conversation.</div>';if(wasAtBottom)el.scrollTop=el.scrollHeight}catch(e){console.error("Live DM refresh failed",e)}}
setInterval(()=>{if(document.visibilityState!=="visible")return;if(state.view==="channel"&&state.channel)loadMessages(state.channel.id);if(state.view==="dms"&&state.dmOpenId)refreshOpenDM()},250);
start();
</script>
</body>
</html>
