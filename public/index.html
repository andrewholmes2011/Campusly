/* Cross-device layout consistency */
html{min-height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-width:320px;min-height:100vh;overflow-x:hidden}
#app{min-height:100vh}
button,input,textarea,select{min-width:0}
button{touch-action:manipulation}

.layout{width:100%;min-width:0}
.sidebar,.main,.content,.chatlayout,.chatmain,.chatmessages,.composer,.members{min-width:0}
.content{overflow-wrap:anywhere}
.pagehead h1,.pagehead p,.workspace strong,.workspace small,.listrow .details,.messagehead{min-width:0;overflow-wrap:anywhere}
.pagehead .actions{flex-wrap:wrap}

async function renderSearch(query){
 const main=$("#main");main.innerHTML=head("Search results","Searching spaces and messages you are allowed to access.")+'<div class="content"><div id="searchResults" class="list"><div class="empty">Searching…</div></div></div>';
 const out=$("#searchResults");
 try{
  const d=await api("/search?q="+encodeURIComponent(query));
  const channels=d.channels||[],messages=d.messages||[],dms=d.direct_messages||[];
  let html="";
  if(channels.length)html+='<div class="sectiontitle"><h2>Channels</h2></div>'+channels.map(c=>'<button class="listrow" style="width:100%;text-align:left;color:inherit" data-search-channel="'+esc(c.id)+'"><div class="details"><strong># '+esc(c.name)+'</strong><small>'+esc(c.class_name)+' · '+esc(c.description||"Class channel")+'</small></div></button>').join("");
  if(messages.length)html+='<div class="sectiontitle"><h2>Channel messages</h2></div>'+messages.map(m=>'<div class="listrow"><div class="details"><strong>'+esc(m.username)+' in #'+esc(m.channel_name)+' · '+esc(m.class_name)+'</strong><small>'+esc(new Date(m.created_at).toLocaleString())+'</small><div>'+esc(m.content)+'</div></div><button class="btn" data-search-channel="'+esc(m.channel_id)+'">Open</button></div>').join("");
  if(dms.length)html+='<div class="sectiontitle"><h2>Private messages</h2><p>Only messages from your own conversations are included.</p></div>'+dms.map(m=>'<div class="listrow"><div class="details"><strong>'+esc(m.username)+' · Private message</strong><small>'+esc(new Date(m.created_at).toLocaleString())+'</small><div>'+esc(m.content)+'</div></div></div>').join("");
  out.innerHTML=html||'<div class="empty">No matching results. Try a different search.</div>';
  out.querySelectorAll("[data-search-channel]").forEach(b=>b.onclick=()=>openChannel(b.dataset.searchChannel));
 }catch(e){out.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}

 $("#createUser").onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,r=$("#createUserResult");try{await api("/admin/users",{method:"POST",body:JSON.stringify({username:f.elements.username.value,password:f.elements.password.value,role:f.elements.role.value})});r.textContent="Account created.";r.className="notice success";f.reset();await refresh()}catch(err){r.textContent=err.message;r.className="notice error"}};
 await refresh();

function renderProfile(){
 const main=$("#main");
 main.innerHTML=head("Customize your profile","Edit your web profile, sign-in username, display name, and avatar.")+'<div class="content"><section class="card" style="max-width:720px"><div style="display:flex;align-items:center;gap:14px;margin-bottom:20px">'+avatarHTML(state.user.username,state.user.avatar_url,'avatar')+'<div><h2 style="margin:0">'+esc(state.user.display_name||state.user.username)+'</h2><small style="color:var(--muted)">@'+esc(state.user.username)+' · '+esc(state.user.role)+'</small></div></div><form id="profileForm"><div class="field"><label for="profileUsername">Login username</label><input id="profileUsername" name="username" required minlength="3" maxlength="64" pattern="[A-Za-z0-9._-]+" value="'+esc(state.user.username)+'"><small style="color:var(--muted)">This is the username you use to sign in. It must be unique.</small></div><div class="field"><label for="displayName">Real name / display name</label><input id="displayName" name="display_name" maxlength="80" required value="'+esc(state.user.display_name||state.user.username)+'" placeholder="Your real name or display name"><small style="color:var(--muted)">Only use your real name if you are comfortable with members of your servers seeing it.</small></div><div class="field"><label for="avatarUrl">Avatar image URL (optional)</label><input id="avatarUrl" name="avatar_url" type="url" value="'+(String(state.user.avatar_url||"").startsWith("https://")?esc(state.user.avatar_url):"")+'" placeholder="https://example.com/avatar.png"><small style="color:var(--muted)">Or upload an image below. PNG, JPEG, or WebP; maximum 180 KB.</small></div><div class="field"><label for="avatarFile">Upload custom avatar</label><input id="avatarFile" type="file" accept="image/png,image/jpeg,image/webp"></div><div id="avatarPreview" style="margin:12px 0">'+avatarHTML(state.user.username,state.user.avatar_url)+'</div><button class="btn primary" type="submit">Save profile</button><div id="profileResult" class="notice" role="status"></div></form><div class="notice">Your username is your sign-in name. Your display name and avatar appear beside messages.</div></section><section class="card" style="max-width:720px;margin-top:16px"><h3>Account ID</h3><p>'+esc(state.user.id)+'</p></section></div>';
 const form=$("#profileForm"),file=$("#avatarFile"),url=$("#avatarUrl"),preview=$("#avatarPreview");
 if(String(state.user.avatar_url||"").startsWith("data:image/"))preview.dataset.upload=state.user.avatar_url;
 file.onchange=()=>{const selected=file.files&&file.files[0];if(!selected)return;if(!["image/png","image/jpeg","image/webp"].includes(selected.type)){file.value="";$("#profileResult").textContent="Choose a PNG, JPEG, or WebP image.";return}if(selected.size>180*1024){file.value="";$("#profileResult").textContent="That image is too large. Choose an image under 180 KB.";return}const reader=new FileReader();reader.onload=()=>{url.value="";preview.innerHTML=avatarHTML(state.user.username,String(reader.result));preview.dataset.upload=String(reader.result);$("#profileResult").textContent="Avatar preview ready. Save profile to apply it."};reader.readAsDataURL(selected)};
 url.oninput=()=>{delete preview.dataset.upload;preview.innerHTML=url.value.trim()?avatarHTML(state.user.username,url.value.trim()):avatarHTML(state.user.username,"");$("#profileResult").textContent="Save profile to apply changes."};
 form.onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;const out=$("#profileResult");try{const avatar=preview.dataset.upload||url.value.trim();const d=await api("/profile",{method:"PATCH",body:JSON.stringify({username:form.elements.namedItem("username").value.trim(),display_name:form.elements.namedItem("display_name").value.trim(),avatar_url:avatar})});state.user={...state.user,...d.user};out.textContent="Profile saved.";shell();navigate("profile")}catch(err){out.textContent=err.message}finally{btn.disabled=false}};
}
function renderSettings(){

 out.querySelectorAll("[data-edit-server-profile]").forEach(b=>b.onclick=async()=>{const c=classes.find(x=>String(x.id)===b.dataset.editServerProfile);if(!c)return;const name=prompt("Server profile name (for example, Algebra 2 → ALG 2):",c.name);if(name===null||!name.trim())return;const description=prompt("Server profile description:",c.description||"");if(description===null)return;try{await api("/admin/classes/"+encodeURIComponent(c.id),{method:"PATCH",body:JSON.stringify({name:name.trim(),description:description.trim()})});renderSettings()}catch(e){alert(e.message)}});

async function renderClassCatalog(){
 const main=$("#main");
 main.innerHTML=head("Class servers","Prebuilt class spaces with channels for announcements, questions, homework, and resources.",'<button class="btn" id="refreshCatalog">Refresh</button>')+'<div class="content"><section class="welcome"><h2>Your classes, organized like servers.</h2><p>Join a class server to unlock its channels. Each class has its own chat, and your profile name and avatar appear across Campusly.</p></section><div id="classCatalog" class="list"><div class="empty">Loading class servers…</div></div></div>';
 const out=$("#classCatalog");
 async function refresh(){
  out.innerHTML='<div class="empty">Loading class servers…</div>';
  try{
   const d=await api("/class-catalog");const classes=d.classes||[];
   out.innerHTML=classes.map(c=>'<article class="listrow class-server-card" style="align-items:flex-start;gap:14px"><div class="mark" style="flex-shrink:0">C</div><div class="details"><button class="class-title-button" data-toggle-class="'+esc(c.id)+'" aria-expanded="false"><strong>'+esc(c.name)+'</strong><span class="tag">'+(c.joined?"Joined":"Class server")+' ▾</span></button><small>'+esc(c.description||"Class server")+' · '+esc(c.member_count)+' member(s)</small><div class="class-channels" id="class-channels-'+esc(c.id)+'" hidden>'+(c.joined?'<p style="color:var(--muted);margin:12px 0 8px">Channels in '+esc(c.name)+'</p><div style="display:grid;gap:8px">'+(state.channels.filter(ch=>String(ch.class_id)===String(c.id)).map(ch=>'<button class="btn class-channel-button" data-catalog-channel="'+esc(ch.id)+'"># '+esc(ch.name)+' <span>Open chat →</span></button>').join("")||'<small style="color:var(--muted)">No channels available yet.</small>')+'</div>':'<p style="color:var(--muted);margin:12px 0">Join this class to see its channels and chat.</p><button class="btn primary" data-join-class="'+esc(c.id)+'">Join class server</button>')+'</div></div><button class="btn class-open" data-toggle-class="'+esc(c.id)+'">View class ▾</button></article>').join("")||'<div class="empty">No predefined class servers are available.</div>';
   out.querySelectorAll("[data-toggle-class]").forEach(b=>b.onclick=()=>{const panel=$("#class-channels-"+CSS.escape(b.dataset.toggleClass));if(!panel)return;const open=panel.hidden;panel.hidden=!open;out.querySelectorAll("[data-toggle-class=\""+CSS.escape(b.dataset.toggleClass)+"\"]").forEach(x=>{x.setAttribute("aria-expanded",String(open));const tag=x.querySelector(".tag");if(tag)tag.textContent=(tag.textContent.replace(/[▾▴]/g,"").trim())+(open?" ▴":" ▾");if(x.classList.contains("class-open"))x.textContent=open?"Hide channels ▴":"View class ▾";});});out.querySelectorAll("[data-catalog-channel]").forEach(b=>b.onclick=()=>openChannel(b.dataset.catalogChannel));
   out.querySelectorAll("[data-join-class]").forEach(b=>b.onclick=async()=>{const btn=b;btn.disabled=true;try{await api("/class-catalog/join",{method:"POST",body:JSON.stringify({class_id:btn.dataset.joinClass})});await loadChannels();await refresh()}catch(e){alert(e.message);btn.disabled=false}});
  }catch(e){out.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
 }
 $("#refreshCatalog").onclick=refresh;
 await refresh();
}
async function renderServers(){
 const main=$("#main");
 main.innerHTML=head("Your servers","Separate communities with their own members and channels.")+'<div class="content"><div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><article class="card"><h3>Create a server</h3><p>Create a private community with its own member list and general channel.</p><form id="createServer"><div class="field"><label>Server name</label><input name="name" required maxlength="80" placeholder="e.g. AP Human Geography"></div><div class="field"><label>Description</label><input name="description" maxlength="500" placeholder="What is this server for?"></div><button class="btn primary">Create server</button><div class="notice" id="createServerResult"></div></form></article><article class="card"><h3>Join a server</h3><p>Enter an invite code from a server member. You will only see chats in servers you have joined.</p><form id="joinServer"><div class="field"><label>Invite code</label><input name="invite_code" required minlength="8" maxlength="10" placeholder="e.g. a1b2c3d4"></div><button class="btn">Join server</button><div class="notice" id="joinServerResult"></div></form></article></div><div class="sectiontitle"><h2>Servers you belong to</h2><button class="btn" id="refreshServers">Refresh</button></div><div id="serverList" class="list"><div class="empty">Loading your servers…</div></div></div>';
 async function refresh(){const out=$("#serverList");try{const d=await api("/servers");state.servers=d.servers||[];out.innerHTML=state.servers.map(s=>{const channels=state.channels.filter(ch=>String(ch.class_id)===String(s.id));return '<article class="listrow" style="align-items:flex-start"><div class="mark" style="flex-shrink:0">S</div><div class="details"><strong>'+esc(s.name)+'</strong><small>'+esc(s.description||"Campusly server")+' · '+esc(s.member_count)+' member(s) · '+esc(s.server_role)+'</small><div style="margin-top:8px"><strong style="display:inline;font-size:12px">Invite code: </strong><code>'+esc(s.invite_code)+'</code> <button class="btn" data-copy-code="'+esc(s.invite_code)+'" type="button">Copy</button></div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">'+(channels.map(ch=>'<button class="btn" data-server-channel="'+esc(ch.id)+'"># '+esc(ch.name)+'</button>').join("")||'<small style="color:var(--muted)">No channels yet.</small>')+((s.server_role==="teacher"||state.user.role==="administrator")?'<button class="btn" data-create-channel="'+esc(s.id)+'">＋ Create channel</button>':"")+'</div></div></article>'}).join("")||'<div class="empty">You have not joined any servers yet. Create one or join with an invite code.</div>';out.querySelectorAll("[data-server-channel]").forEach(b=>b.onclick=()=>openChannel(b.dataset.serverChannel));out.querySelectorAll("[data-create-channel]").forEach(b=>b.onclick=async()=>{const name=prompt("New channel name (letters, numbers, and hyphens):");if(!name||!name.trim())return;const description=prompt("Channel description (optional):")||"";try{await api("/admin/channels",{method:"POST",body:JSON.stringify({class_id:b.dataset.createChannel,name:name.trim(),description})});await loadChannels();await refresh()}catch(e){alert(e.message)}});out.querySelectorAll("[data-copy-code]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copyCode);b.textContent="Copied"}catch{prompt("Copy this invite code:",b.dataset.copyCode)}})}catch(e){out.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
 $("#refreshServers").onclick=async()=>{await loadChannels();await refresh()};
 $("#createServer").onsubmit=async e=>{e.preventDefault();const f=e.target;const out=$("#createServerResult");try{const d=await api("/servers",{method:"POST",body:JSON.stringify({name:f.name.value.trim(),description:f.description.value.trim()})});out.textContent="Server created. Share its invite code with people you want to invite: "+d.server.invite_code;f.reset();await loadChannels();await refresh()}catch(err){out.textContent=err.message}};
 $("#joinServer").onsubmit=async e=>{e.preventDefault();const f=e.target;const out=$("#joinServerResult");try{const d=await api("/servers/join",{method:"POST",body:JSON.stringify({invite_code:f.invite_code.value.trim()})});out.textContent="Joined "+d.server.name+".";f.reset();await loadChannels();await refresh()}catch(err){out.textContent=err.message}};

function openPreferenceDialog(section){
 const labels={profile:["Edit profile","Update your display name and avatar.","Open profile editor"],notifications:["Notifications","Choose how Campusly should notify you on this device.","Notification preferences"],appearance:["Appearance","Choose the workspace theme.","Theme"],accessibility:["Accessibility","Set motion and interface preferences.","Accessibility preferences"],privacy:["Privacy and safety","Review safety and privacy guidance for your account.","Privacy information"],school:["School information","School membership is granted by verified enrollment, not by a typed school name.","School membership"],server:["Server settings","Manage the selected server using the authorized server-management tools.","Server management"]};
 const info=labels[section]||labels.privacy;const existing=$("#preferenceDialog");if(existing)existing.remove();
 const saved=(key,fallback)=>{try{return localStorage.getItem("campusly."+key)||fallback}catch{return fallback}};
 let controls="";
 if(section==="appearance")controls='<label class="settings-menu-label" for="campuslyTheme">Theme</label><select id="campuslyTheme" class="preference-select"><option value="dark">Dark</option><option value="light">Light</option><option value="system">Use device setting</option></select>';
 if(section==="notifications")controls='<label class="preference-check"><input type="checkbox" id="campuslyNotify" '+(saved("notifications","on")==="on"?"checked":"")+'> Enable in-app notification reminders</label><p class="preference-help">Browser push notifications are not enabled by this deployment.</p>';
 if(section==="accessibility")controls='<label class="preference-check"><input type="checkbox" id="campuslyReduceMotion" '+(saved("reduceMotion","off")==="on"?"checked":"")+'> Reduce interface animations</label><p class="preference-help">Keyboard focus outlines are enabled throughout Campusly.</p>';
 if(section==="privacy")controls='<div class="preference-help">• Only access communities you are enrolled in.<br>• Do not share passwords, addresses, or other sensitive information in messages.<br>• Use Report message to alert school moderators.<br>• Private messages are visible to their conversation participants and authorized platform processing.</div>';
 if(section==="school")controls='<div class="preference-help">School membership is verified through server-side enrollment. Ask your school administrator to provision your account or add you to the correct community. Entering a school name alone does not grant access.</div>';
 if(section==="server")controls='<div class="preference-help">Current server: <strong>'+esc(state.activeServerName||state.channel?.class_name||"None selected")+'</strong><br>Server and channel administration is available only to authorized roles. Open My servers to view the management actions available to your account.</div><button class="btn primary" id="preferenceManageServer">Open server management</button>';
 if(section==="profile"){existing?.remove();navigate("profile");return}
 const modal=document.createElement("div");modal.id="preferenceDialog";modal.className="settings-overlay";modal.innerHTML='<section class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="preferenceTitle"><header class="settings-dialog-head"><div><small>CAMPUSLY SETTINGS</small><h2 id="preferenceTitle">'+esc(info[0])+'</h2><p>'+esc(info[1])+'</p></div><button class="settings-close" aria-label="Close dialog">×</button></header><div class="settings-dialog-body">'+controls+'<div class="settings-dialog-foot"><button class="btn" id="preferenceCancel">Close</button><button class="btn primary" id="preferenceSave">Save preferences</button></div></div></section>';
 document.body.appendChild(modal);const close=()=>modal.remove();modal.querySelector(".settings-close").onclick=close;modal.querySelector("#preferenceCancel").onclick=close;modal.addEventListener("click",e=>{if(e.target===modal)close()});
 const theme=modal.querySelector("#campuslyTheme");if(theme){theme.value=saved("theme","dark");theme.onchange=()=>applyCampuslyTheme(theme.value)}
 const reduce=modal.querySelector("#campuslyReduceMotion");if(reduce)reduce.onchange=()=>{document.documentElement.classList.toggle("campusly-reduce-motion",reduce.checked)};
 modal.querySelector("#preferenceSave").onclick=()=>{try{if(theme)localStorage.setItem("campusly.theme",theme.value);const notify=modal.querySelector("#campuslyNotify");if(notify)localStorage.setItem("campusly.notifications",notify.checked?"on":"off");if(reduce)localStorage.setItem("campusly.reduceMotion",reduce.checked?"on":"off")}catch{}if(theme)applyCampuslyTheme(theme.value);if(reduce)document.documentElement.classList.toggle("campusly-reduce-motion",reduce.checked);close();showRouteNotice("Preferences saved on this device.")};
 const manage=modal.querySelector("#preferenceManageServer");if(manage)manage.onclick=()=>{close();navigate("servers")};
 const key=e=>{if(e.key==="Escape"){close();document.removeEventListener("keydown",key)}};document.addEventListener("keydown",key);
}
function applyCampuslyTheme(theme){const mode=theme==="system"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):theme;document.body.classList.toggle("campusly-light",mode==="light");try{localStorage.setItem("campusly.theme",theme)}catch{}}
function initializeCampuslyPreferences(){let theme="dark",motion="off";try{theme=localStorage.getItem("campusly.theme")||"dark";motion=localStorage.getItem("campusly.reduceMotion")||"off"}catch{}applyCampuslyTheme(theme);document.documentElement.classList.toggle("campusly-reduce-motion",motion==="on")}
window.addEventListener("popstate",()=>{if(state.user)restoreRoute()});

async function start(){try{const d=await api("/me");state.user=d.user;initializeCampuslyPreferences();await loadChannels();shell();restoreRoute();}catch(e){login()}}
async function refreshOpenDM(){const id=state.dmOpenId;const el=$("#dmMessages");if(!id||!el||state.view!=="dms")return;try{const d=await api("/dms/"+encodeURIComponent(id)+"/messages");const messages=d.messages||[];const key=messages.map(m=>m.id).join("|");if(el.dataset.messageKey===key)return;const wasAtBottom=el.scrollHeight-el.scrollTop-el.clientHeight<80;el.dataset.messageKey=key;el.innerHTML=messages.map(m=>'<div class="listrow"><div class="details"><strong>'+esc(m.username)+' <small style="font-weight:400;color:var(--muted)">'+esc(new Date(m.created_at).toLocaleString())+'</small></strong><div>'+esc(m.content)+'</div></div></div>').join("")||'<div class="empty">Say hello to start the conversation.</div>';if(wasAtBottom)el.scrollTop=el.scrollHeight}catch(e){console.error("Live DM refresh failed",e)}}
setInterval(()=>{if(document.visibilityState!=="visible")return;if(state.view==="channel"&&state.channel)loadMessages(state.channel.id);if(state.view==="dms"&&state.dmOpenId)refreshOpenDM()},250);
start();
</script>
